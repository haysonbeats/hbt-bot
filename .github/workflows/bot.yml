name: HBT XAUUSD AUTO BOT

on:
  schedule:
    - cron: '*/30 8-15 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Restore Sent Today Cache
        uses: actions/cache@v4
        with:
          path: sent_today.txt
          key: sent-${{ github.run_id }}
          restore-keys: |
            sent-

      - name: Run HBT Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save Sent Today File
        uses: actions/cache@v4
        with:
          path: sent_today.txt
          key: sent-${{ github.run_id }}
