name: HBT Bot
on:
  schedule:
    - cron: '*/15 5-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save daily state
        run: |
          git config user.name "hbt-bot"
          git config user.email "bot@hbt.com"
          git add daily_state.json || true
          git commit -m "update daily signal state" || true
          git push || true
