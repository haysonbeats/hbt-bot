name: HBT XAUUSD AUTO BOT

on:
  schedule:
    # Every 30 mins, 11AM - 6PM EAT (8AM - 3PM UTC), Mon-Fri
    - cron: '*/30 8-15 * * 1-5'
  workflow_dispatch: # Allows you to run manually with a button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Run HBT Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Save Sent Today File
        run: |
          echo "Done"
